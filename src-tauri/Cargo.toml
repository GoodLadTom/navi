[package]
name = "navi"
version = "0.1.4"
description = "Navi: local, private dictation that writes like you."
authors = ["GoodLad"]
license = "GPL-3.0-only"
repository = "https://github.com/GoodLadTom/navi"
edition = "2021"
rust-version = "1.90"

[lib]
name = "navi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
cpal = "0.16"
dirs = "7.0.0"
futures-util = "0.3.34"
hex = "0.4.3"
hound = "3.5.1"
jpeg-encoder = "0.6"
ignore = "0.4.30"
keyring = { version = "3.6.3", features = ["windows-native"] }
log = "0.4.34"
parking_lot = "0.12.5"
regex = "1.13.1"
rodio = { version = "0.21", default-features = false, features = ["wav", "playback"] }
rubato = "0.16"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
similar = "3.2.0"
strsim = "0.11.1"
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs", "io-util", "net"] }
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }

reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Com", "Win32_UI_Accessibility", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_ProcessStatus", "Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_System_Variant", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_WinRT", "Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Foundation", "Foundation_Collections", "Globalization", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_UI_HiDpi", "Win32_Security_Authentication_Identity", "Win32_NetworkManagement_NetManagement", "Win32_System_Registry", "Media_Control", "Win32_Media_Audio", "Win32_System_Com_StructuredStorage"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-application-services = "0.3"
objc2-core-audio = "0.3"
objc2-core-audio-types = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-vision = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"

# cpal 0.16.0 with its macOS Core Audio size arguments made writable: the published 0.16.0 crashes
# an optimised Mac build when it lists audio devices. See vendor/cpal/NAVI-PATCH.md.
[patch.crates-io]
cpal = { path = "vendor/cpal" }
