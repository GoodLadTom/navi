# Builds and tests Navi on a Mac. The Mac-only code (hotkey.rs mod mac, insert.rs mod mac, the
# mac/ folder) can't be compiled on Windows, and Mac copies update by pulling main and building
# from source, so a change that breaks the Mac build must be caught here first.
name: Mac check

on:
  push:
    branches: [main, "mac-*"]
    paths: ["src-tauri/**", "ui/**", ".github/workflows/mac-check.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      # The whole history: update.rs's tests clone this repository and step back through main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Not --all-targets: examples/card_check.rs is a Windows-only tool.
      - name: Build
        run: cargo check --lib --bins --tests
      - name: Tests
        run: cargo test --lib
